<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>Галерия TDR – добре дошли</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Слайд за телевизор 16:9. Размерите са във vh, за да е еднакво на Full HD и 4K. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f3ede4; }
  body { font-family: Inter, "Segoe UI", Arial, sans-serif; color: #2a241f; }
  .wash { position: absolute; border-radius: 50%; filter: blur(6vh); opacity: .55; animation: drift 18s ease-in-out infinite alternate; }
  .w1 { width: 70vh; height: 70vh; left: -12vh; top: -18vh; background: radial-gradient(circle at 40% 40%, #e9b48f, rgba(233,180,143,0) 70%); }
  .w2 { width: 80vh; height: 80vh; left: 38vh; bottom: -40vh; background: radial-gradient(circle at 50% 50%, #9cc3b9, rgba(156,195,185,0) 70%); animation-delay: -6s; }
  .w3 { width: 50vh; height: 50vh; left: 70vh; top: 8vh; background: radial-gradient(circle at 50% 50%, #c9b6e4, rgba(201,182,228,0) 70%); animation-delay: -11s; }
  @keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(4vh, 3vh) scale(1.08); } }

  .text { position: absolute; left: 9vh; top: 0; bottom: 0; width: 88vh; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 2.4vh; font-weight: 600; letter-spacing: .4em; text-transform: uppercase; color: #b5532e; opacity: 0; animation: up .9s .2s ease-out forwards; }
  h1 { margin: 2vh 0 0; font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 15vh; line-height: .95; letter-spacing: -.01em; opacity: 0; animation: up 1.1s .5s ease-out forwards; }
  .place { margin-top: 1.5vh; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: 5.5vh; color: #5b5047; opacity: 0; animation: up 1s .9s ease-out forwards; }
  .rule { width: 0; height: .35vh; margin: 5vh 0 4vh; background: #2a241f; animation: rule 1.2s 1.3s ease-out forwards; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { font-size: 3.6vh; font-weight: 500; margin: 1.4vh 0; display: flex; align-items: center; opacity: 0; animation: up .8s ease-out forwards; }
  li:nth-child(1) { animation-delay: 1.8s; } li:nth-child(2) { animation-delay: 2.2s; } li:nth-child(3) { animation-delay: 2.6s; }
  li b { display: inline-block; width: 1.4vh; height: 1.4vh; border-radius: 50%; margin-right: 2.2vh; }
  @keyframes up { from { opacity: 0; transform: translateY(3vh); } to { opacity: 1; transform: none; } }
  @keyframes rule { to { width: 22vh; } }

  .art { position: absolute; width: 46vh; height: 46vh; box-shadow: 0 3vh 6vh rgba(42,36,31,.25); background: #fff center / cover no-repeat; opacity: 0; }
  .a1 { right: 60vh; top: 13vh; background-image: url(https://cdn.bansko.now/shop/LNK4309_frame.webp); animation: art 1.4s 1s ease-out forwards, float 9s 2.4s ease-in-out infinite alternate; }
  .a2 { right: 8vh; top: 6vh; width: 52vh; height: 52vh; background-image: url(https://cdn.bansko.now/shop/MOMA4-k.webp); animation: art 1.4s 1.4s ease-out forwards, float 11s 2.8s ease-in-out infinite alternate; }
  .a3 { right: 26vh; bottom: 6vh; width: 40vh; height: 40vh; background-image: url(https://cdn.bansko.now/shop/SA62-k-blue-manatee.webp); animation: art 1.4s 1.8s ease-out forwards, float 10s 3.2s ease-in-out infinite alternate; }
  @keyframes art { from { opacity: 0; transform: translateY(5vh) scale(.96); } to { opacity: 1; transform: none; } }
  @keyframes float { from { margin-top: 0; } to { margin-top: -1.6vh; } }
</style>
</head>
<body>
  <span class="wash w1"></span><span class="wash w2"></span><span class="wash w3"></span>
  <div class="text">
    <div class="kicker">Добре дошли</div>
    <h1>Галерия TDR</h1>
    <div class="place">Банско</div>
    <div class="rule"></div>
    <ul>
      <li><b style="background:#b5532e"></b>Пейзажна фотография</li>
      <li><b style="background:#3f7d6e"></b>Акварели, рисувани на ръка</li>
      <li><b style="background:#7a5fa8"></b>Принтове и платна</li>
    </ul>
  </div>
  <div class="art a1"></div><div class="art a2"></div><div class="art a3"></div>
</body>
</html>
