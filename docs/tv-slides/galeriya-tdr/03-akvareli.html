<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>Галерия TDR – акварели</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f6f2ec; }
  body { font-family: Inter, "Segoe UI", Arial, sans-serif; color: #26302d; }
  .splash { position: absolute; border-radius: 50%; filter: blur(5vh); opacity: .5; }
  .s1 { width: 60vh; height: 60vh; left: -15vh; bottom: -20vh; background: radial-gradient(circle, #8fd0c4, rgba(143,208,196,0) 70%); }
  .s2 { width: 50vh; height: 50vh; left: 40vh; top: -20vh; background: radial-gradient(circle, #c8b4ea, rgba(200,180,234,0) 70%); }
  .text { position: absolute; left: 8vh; top: 0; bottom: 0; width: 50vh; display: flex; flex-direction: column; justify-content: center; }
  .kicker { font-size: 2.3vh; font-weight: 600; letter-spacing: .4em; text-transform: uppercase; color: #3f7d6e; opacity: 0; animation: up .9s .2s ease-out forwards; }
  h1 { margin: 2.5vh 0 0; font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 11vh; line-height: 1; opacity: 0; animation: up 1s .5s ease-out forwards; }
  .lead { margin: 4vh 0 0; font-size: 3vh; line-height: 1.45; color: #4b5753; opacity: 0; animation: up 1s .9s ease-out forwards; }
  .by { margin-top: 5vh; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: 4vh; opacity: 0; animation: up 1s 1.3s ease-out forwards; }
  .grid { position: absolute; right: 7vh; top: 7vh; width: 106vh; height: 86vh; }
  .tile { position: absolute; width: 33vh; height: 41vh; background: #fff center / cover no-repeat; box-shadow: 0 2vh 4vh rgba(38,48,45,.18); opacity: 0; animation: pop 1s ease-out forwards; }
  @keyframes pop { from { opacity: 0; transform: translateY(4vh) rotate(-1.5deg) scale(.95); } to { opacity: 1; transform: none; } }
  @keyframes up { from { opacity: 0; transform: translateY(3vh); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <span class="splash s1"></span><span class="splash s2"></span>
  <div class="text">
    <div class="kicker">Оригинални рисунки</div>
    <h1>Акварели</h1>
    <p class="lead">Животни, море и цвят – всяка картина е рисувана на ръка, а принтовете пазят всеки детайл на боята.</p>
    <div class="by">Славейка Аладжова</div>
  </div>
  <div class="grid" id="grid"></div>
<script>
  var art = [
    "SA62-k-blue-manatee", "SA6161-k-seahorse", "SA43-k-cat",
    "SA172-k-otter", "SA237-k-blue-sea-turtle", "SA503-k-blue-horse"
  ];
  var grid = document.getElementById("grid");
  for (var i = 0; i < art.length; i++) {
    var tile = document.createElement("div");
    tile.className = "tile";
    tile.style.left = (i % 3) * 36 + "vh";
    tile.style.top = Math.floor(i / 3) * 44 + "vh";
    tile.style.backgroundImage = "url(https://cdn.bansko.now/shop/" + art[i] + ".webp)";
    tile.style.animationDelay = (0.8 + i * 0.35) + "s";
    grid.appendChild(tile);
  }
</script>
</body>
</html>
