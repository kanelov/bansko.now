<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<title>Галерия TDR – Limited Edition</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8f2a22; }
  body { font-family: Inter, "Segoe UI", Arial, sans-serif; color: #fbf3e8; background: radial-gradient(circle at 20% 30%, #a8362b, #6d1d18 75%); }
  .head { position: absolute; left: 0; right: 0; top: 7vh; text-align: center; }
  .kicker { font-size: 2.4vh; font-weight: 600; letter-spacing: .5em; text-transform: uppercase; color: #f3c88a; opacity: 0; animation: up .9s .2s ease-out forwards; }
  h1 { margin: 2vh 0 0; font-family: "Playfair Display", Georgia, serif; font-weight: 600; font-size: 9vh; line-height: 1; opacity: 0; animation: up 1s .5s ease-out forwards; }
  .lead { margin: 2vh 0 0; font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: 3.6vh; color: #f1dcc4; opacity: 0; animation: up 1s .9s ease-out forwards; }
  .row { position: absolute; left: 0; right: 0; bottom: 7vh; text-align: center; font-size: 0; }
  .card { display: inline-block; width: 50vh; height: 50vh; margin: 0 2vh; background: #fff center / cover no-repeat; box-shadow: 0 3vh 6vh rgba(0,0,0,.35); opacity: 0; animation: rise 1.2s ease-out forwards; }
  .card:nth-child(2) { width: 56vh; height: 56vh; }
  @keyframes rise { from { opacity: 0; transform: translateY(8vh); } to { opacity: 1; transform: none; } }
  @keyframes up { from { opacity: 0; transform: translateY(3vh); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
  <div class="head">
    <div class="kicker">Limited Edition</div>
    <h1>Моми в пиринска носия</h1>
    <p class="lead">Картини в ограничено издание</p>
  </div>
  <div class="row">
    <span class="card" style="background-image:url(https://cdn.bansko.now/shop/MOMA5-k.webp);animation-delay:1.2s"></span><span class="card" style="background-image:url(https://cdn.bansko.now/shop/MOMA4-k.webp);animation-delay:1.5s"></span><span class="card" style="background-image:url(https://cdn.bansko.now/shop/SAP112-k-lazarka-ot-selo-pirin-sandansko.webp);animation-delay:1.8s"></span>
  </div>
</body>
</html>
